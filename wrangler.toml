name = "road-report"
main = "worker/index.ts"
# Latest date the local wrangler runtime supports; production uses the same date.
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]
# Not served on *.workers.dev (including preview URLs); attach a custom domain or route instead.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /__scheduled lets `wrangler dev --test-scheduled` reach the Worker; in production it falls through to the SPA.
run_worker_first = ["/api/*", "/__scheduled"]

# ROAD_REPORT_KV
[[kv_namespaces]]
binding = "REPORTS"
id = "c6fd16918097479dbaf138b181cf359e"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "road-report-r2"

[triggers]
# Hourly, but each case is only rechecked about once a day (see worker/sync.ts).
crons = ["17 * * * *"]

[vars]
REPAIR_SUBMIT_ENABLED = "false"

[observability]
enabled = true
