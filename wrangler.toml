name = "road-report"
main = "worker/index.ts"
# Latest date the local wrangler runtime supports; production uses the same date.
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /__scheduled lets `wrangler dev --test-scheduled` reach the Worker; in production it falls through to the SPA.
run_worker_first = ["/api/*", "/__scheduled"]

# No resource IDs in the repo: on the first deploy, pick the existing ROAD_REPORT_KV namespace;
# later deploys inherit the binding from the deployed Worker.
[[kv_namespaces]]
binding = "REPORTS"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "road-report-r2"

[triggers]
# Hourly, but each case is only rechecked about once a day (see worker/sync.ts).
crons = ["17 * * * *"]

[vars]
REPAIR_SUBMIT_ENABLED = "false"

[observability]
enabled = true
